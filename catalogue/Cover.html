<html>
<head>
<title>Prince Furniture Catalogue</title>
<link rel="stylesheet" href="PrinceCatalogue.css" />
<style>
@page {
    size: 8.5in 10.5in;
    margin: 0;
    background: url("images/CatalogueCover.jpg");
    background-position: center;
    background-size: 102%;
    background-repeat: no-repeat;
    marks: crop cross;
    bleed: 0.25in;
    -prince-trim: 0.25in;
}
</style>
</head>
<body>
<div id="cover" class="page">
  <div class="logo">
    <img src="images/PrinceFurnitureLogo2.svg"/>
  </div>
  <div class="title">
    <img src="images/CatalogueTitle.svg"/>
  </div>
  <p class="webaddress">
    www.princexml.com
  </p>
  <p class="extrainfo">
    This catalogue is generated using Prince
  </p>
</div>
</body>
</html>
